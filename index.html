<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Study Companion</title>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0d14] text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FULL_SYLLABUS = [
      { id: 'phy_1', subject: 'Physics', name: 'Units & Measurements', p1_11th: true, p2_jee: true, p3_nda: true, progress: 0, stream: 'Common' },
      { id: 'phy_2', subject: 'Physics', name: 'Motion in a Straight Line', p1_11th: true, p2_jee: true, p3_nda: true, progress: 0, stream: 'Common' },
      { id: 'chem_1', subject: 'Chemistry', name: 'Some Basic Concepts of Chemistry (Mole Concept)', p1_11th: true, p2_jee: true, p3_nda: true, progress: 0, stream: 'Common' },
      { id: 'math_1', subject: 'Mathematics', name: 'Trigonometric Functions & Identities', p1_11th: true, p2_jee: true, p3_nda: true, progress: 0, stream: 'Common' }
    ];

    function App() {
      const [syllabus, setSyllabus] = useState(() => {
        try {
          const saved = localStorage.getItem('nexus_app_syllabus');
          if (saved) return JSON.parse(saved);
        } catch (e) { console.error(e); }
        return FULL_SYLLABUS;
      });

      useEffect(() => {
        localStorage.setItem('nexus_app_syllabus', JSON.stringify(syllabus));
      }, [syllabus]);

      const updateProgress = (id, newProg) => {
        const val = Math.min(100, Math.max(0, parseInt(newProg) || 0));
        setSyllabus(prev => prev.map(ch => ch.id === id ? { ...ch, progress: val } : ch));
      };

      const overall = useMemo(() => {
        return syllabus.length ? Math.round(syllabus.reduce((acc, curr) => acc + curr.progress, 0) / syllabus.length) : 0;
      }, [syllabus]);

      return (
        <div className="max-w-3xl mx-auto p-6 space-y-6">
          <div className="bg-[#11131f] border border-slate-800 p-6 rounded-2xl shadow-xl flex items-center justify-between">
            <div>
              <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">Class 11th + PW + NDA</span>
              <h1 className="text-2xl font-bold text-white mt-2">Nexus Study Companion</h1>
              <p className="text-xs text-slate-400 mt-1">Single-file standalone browser application</p>
            </div>
            <div className="text-right">
              <div className="text-3xl font-extrabold text-emerald-400 font-mono">{overall}%</div>
              <div className="text-[10px] text-slate-400 uppercase tracking-wider">Overall Readiness</div>
            </div>
          </div>

          <div className="bg-[#11131f] border border-slate-800 p-6 rounded-2xl space-y-4 shadow-xl">
            <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Course Progress Tracker</h2>
            <div className="space-y-3">
              {syllabus.map(item => (
                <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4">
                  <div className="flex-1">
                    <div className="font-semibold text-white text-sm">{item.name}</div>
                    <div className="text-xs text-indigo-400 font-medium">{item.subject} • {item.stream}</div>
                    <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                      <div className="bg-indigo-500 h-full transition-all duration-300" style={{ width: `${item.progress}%` }}></div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <input 
                      type="number" 
                      min="0" 
                      max="100" 
                      value={item.progress} 
                      onChange={(e) => updateProgress(item.id, e.target.value)}
                      className="w-16 bg-slate-950 border border-slate-700 rounded-lg p-2 text-center text-white text-sm font-mono focus:outline-none focus:border-indigo-500"
                    />
                    <span className="text-xs text-slate-400">%</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
